<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243c32">
  <meta name="description" content="">
  <title>Maison Sereine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body data-page="accueil">
  <a class="skip-link" href="#contenu" data-content="accessibilite.lien"></a>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Maison Sereine — accueil"><span class="brand-mark" aria-hidden="true">M<span>S</span></span><span class="brand-name" data-content="site.nom"></span></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation-principale" data-aria-label="accessibilite.menu" data-content="accessibilite.ouvrir_menu"><span></span><span></span></button>
    <nav class="main-nav" id="navigation-principale" aria-label="Navigation principale"><a href="index.html" data-content="site.navigation.0.label"></a><a href="services.html" data-content="site.navigation.1.label"></a><a href="a-propos.html" data-content="site.navigation.2.label"></a><a href="contact.html" data-content="site.navigation.3.label"></a><a class="nav-cta" href="contact.html" data-content="site.cta"></a></nav>
  </header>
  <main id="contenu">
    <section class="hero hero-home">
      <img class="hero-image" data-attr-src="accueil.hero.image" data-attr-alt="accueil.hero.image_alt" fetchpriority="high">
      <div class="hero-shade"></div>
      <div class="hero-content reveal">
        <p class="eyebrow eyebrow-light" data-content="accueil.hero.eyebrow"></p>
        <h1 data-html="accueil.hero.titre"></h1>
        <p class="hero-copy" data-content="accueil.hero.sous_titre"></p>
        <div class="hero-actions"><a class="button button-light" data-attr-href="accueil.hero.cta1_href" data-content="accueil.hero.cta1"></a><a class="button button-outline-light" data-attr-href="accueil.hero.cta2_href" data-content="accueil.hero.cta2"></a></div>
      </div>
      <a class="hero-scroll" href="#promesse" data-content="accessibilite.defiler"></a>
      <span class="hero-index" aria-hidden="true">01 — 04</span>
    </section>
    <section class="trust-strip" id="promesse">
      <p class="trust-intro" data-content="accueil.confiance.intro"></p>
      <div class="trust-stats" data-list="accueil.confiance.chiffres" data-template="trust-stat"></div>
      <template id="trust-stat"><div class="trust-stat"><strong data-item="valeur"></strong><span data-item="label"></span></div></template>
    </section>
    <section class="section services-preview section-cream">
      <div class="section-heading reveal"><p class="eyebrow" data-content="accueil.services_section.eyebrow"></p><h2 data-content="accueil.services_section.titre"></h2><p data-content="accueil.services_section.intro"></p><a class="text-link" data-attr-href="accueil.services_section.href" data-content="accueil.services_section.lien"></a></div>
      <div class="service-grid" data-list="accueil.services" data-template="service-card"></div>
      <template id="service-card"><article class="service-card reveal"><div class="service-image-wrap"><img data-item-attr-src="image" data-item-attr-alt="alt" loading="lazy"><span class="card-number" data-item="numero"></span></div><div class="service-card-copy"><h3 data-item="titre"></h3><p data-item="description"></p></div></article></template>
    </section>
    <section class="manifesto section-dark">
      <div class="manifesto-image reveal"><img data-attr-src="accueil.manifeste.image" data-attr-alt="accueil.manifeste.image_alt" loading="lazy"><span class="image-stamp" aria-hidden="true">MS</span></div>
      <div class="manifesto-copy reveal"><p class="eyebrow eyebrow-light" data-content="accueil.manifeste.eyebrow"></p><h2 data-content="accueil.manifeste.titre"></h2><p data-content="accueil.manifeste.texte"></p><p class="handwritten" data-content="accueil.manifeste.signature"></p><a class="text-link text-link-light" href="a-propos.html" data-content="site.navigation.2.label"></a></div>
    </section>
    <section class="section steps-section">
      <div class="section-heading section-heading-centered reveal"><p class="eyebrow" data-content="accueil.etapes_section.eyebrow"></p><h2 data-content="accueil.etapes_section.titre"></h2><p data-content="accueil.etapes_section.intro"></p></div>
      <div class="steps-grid" data-list="accueil.etapes" data-template="step-card"></div>
      <template id="step-card"><article class="step-card reveal"><span class="step-number" data-item="numero"></span><h3 data-item="titre"></h3><p data-item="description"></p></article></template>
    </section>
    <section class="section testimonials-section section-cream">
      <div class="section-heading reveal"><p class="eyebrow" data-content="accueil.temoignages_section.eyebrow"></p><h2 data-content="accueil.temoignages_section.titre"></h2><p class="small-note" data-content="accueil.temoignages_section.note"></p></div>
      <div class="testimonial-grid" data-list="accueil.temoignages" data-template="testimonial-card"></div>
      <template id="testimonial-card"><figure class="testimonial-card reveal"><span class="quote-mark" aria-hidden="true">“</span><blockquote data-item="citation"></blockquote><figcaption><strong data-item="auteur"></strong><span data-item="role"></span></figcaption></figure></template>
    </section>
    <section class="final-cta reveal"><p class="eyebrow eyebrow-light" data-content="accueil.cta_final.eyebrow"></p><h2 data-content="accueil.cta_final.titre"></h2><p data-content="accueil.cta_final.texte"></p><a class="button button-light" data-attr-href="accueil.cta_final.href" data-content="accueil.cta_final.bouton"></a><div class="cta-orbit" aria-hidden="true"></div></section>
  </main>
  <footer class="site-footer"><div class="footer-main"><div class="footer-brand"><a class="brand brand-footer" href="index.html"><span class="brand-mark" aria-hidden="true">M<span>S</span></span><span class="brand-name" data-content="site.nom"></span></a><p data-content="site.footer_intro"></p></div><div class="footer-links"><p class="footer-label" data-content="accessibilite.navigation"></p><a href="index.html" data-content="site.navigation.0.label"></a><a href="services.html" data-content="site.navigation.1.label"></a><a href="a-propos.html" data-content="site.navigation.2.label"></a><a href="contact.html" data-content="site.navigation.3.label"></a></div><div class="footer-contact"><p class="footer-label" data-content="accessibilite.contact"></p><a data-attr-href="site.email_href" data-content="site.email"></a><a data-attr-href="site.telephone_href" data-content="site.telephone"></a><span data-content="site.zone"></span></div></div><div class="footer-bottom"><span data-content="site.copyright"></span><span data-content="site.footer_note"></span></div></footer>
</body>
</html>
