<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#243c32"><meta name="description" content=""><title>Contact — Maison Sereine</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head>
<body data-page="contact">
  <a class="skip-link" href="#contenu" data-content="accessibilite.lien"></a><header class="site-header"><a class="brand" href="index.html" aria-label="Maison Sereine — accueil"><span class="brand-mark" aria-hidden="true">M<span>S</span></span><span class="brand-name" data-content="site.nom"></span></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navigation-principale" data-aria-label="accessibilite.menu" data-content="accessibilite.ouvrir_menu"><span></span><span></span></button><nav class="main-nav" id="navigation-principale" aria-label="Navigation principale"><a href="index.html" data-content="site.navigation.0.label"></a><a href="services.html" data-content="site.navigation.1.label"></a><a href="a-propos.html" data-content="site.navigation.2.label"></a><a href="contact.html" data-content="site.navigation.3.label"></a><a class="nav-cta" href="contact.html" data-content="site.cta"></a></nav></header>
  <main id="contenu">
    <section class="page-hero page-hero-short"><img class="page-hero-image" data-attr-src="contact.hero.image" data-attr-alt="contact.hero.alt" fetchpriority="high"><div class="page-hero-overlay"></div><div class="page-hero-content reveal"><p class="eyebrow eyebrow-light" data-content="contact.hero.eyebrow"></p><h1 data-html="contact.hero.titre"></h1><p data-content="contact.hero.intro"></p></div></section>
    <section class="contact-layout section" id="formulaire"><div class="contact-form-wrap reveal"><p class="eyebrow" data-content="contact.formulaire.eyebrow"></p><h2 data-content="contact.formulaire.titre"></h2><p data-content="contact.formulaire.intro"></p><form id="contact-form" novalidate>
      <div class="form-row"><div class="field"><label for="nom" data-content="contact.formulaire.nom"></label><input id="nom" name="nom" autocomplete="name" required></div><div class="field"><label for="email" data-content="contact.formulaire.email"></label><input id="email" name="email" type="email" autocomplete="email" required></div></div>
      <div class="form-row"><div class="field"><label for="telephone" data-content="contact.formulaire.telephone"></label><input id="telephone" name="telephone" type="tel" autocomplete="tel"></div><div class="field"><label for="profil" data-content="contact.formulaire.profil_label"></label><select id="profil" name="profil" data-options="contact.formulaire.profil_options"></select></div></div>
      <div class="field"><label for="message" data-content="contact.formulaire.message"></label><textarea id="message" name="message" rows="5" required></textarea></div>
      <div class="field field-consent"><input id="consentement" name="consentement" type="checkbox" required><label for="consentement" data-content="contact.formulaire.consentement"></label></div>
      <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p><button class="button button-dark" type="submit" data-content="contact.formulaire.bouton"></button><p class="form-help" data-content="contact.formulaire.aide"></p>
    </form></div>
    <aside class="contact-aside reveal"><div class="contact-aside-image"><img data-attr-src="contact.hero.image" data-attr-alt="contact.hero.alt" loading="lazy"></div><div class="contact-details"><h3 data-content="contact.coordonnees.titre"></h3><span class="contact-detail-label" data-content="contact.coordonnees.email_label"></span><a data-attr-href="site.email_href" data-content="site.email"></a><span class="contact-detail-label" data-content="contact.coordonnees.telephone_label"></span><a data-attr-href="site.telephone_href" data-content="site.telephone"></a><span class="contact-detail-label" data-content="contact.coordonnees.zone_label"></span><p data-content="site.zone"></p><span class="contact-detail-label" data-content="contact.coordonnees.horaires_label"></span><p data-content="contact.coordonnees.horaires"></p></div></aside></section>
    <section class="contact-bottom section-dark"><p class="eyebrow eyebrow-light" data-content="site.signature"></p><h2 data-content="contact.cta.titre"></h2><p data-content="contact.cta.texte"></p><a class="button button-light" data-attr-href="contact.cta.href" data-content="contact.cta.bouton"></a></section>
  </main>
  <footer class="site-footer"><div class="footer-main"><div class="footer-brand"><a class="brand brand-footer" href="index.html"><span class="brand-mark" aria-hidden="true">M<span>S</span></span><span class="brand-name" data-content="site.nom"></span></a><p data-content="site.footer_intro"></p></div><div class="footer-links"><p class="footer-label" data-content="accessibilite.navigation"></p><a href="index.html" data-content="site.navigation.0.label"></a><a href="services.html" data-content="site.navigation.1.label"></a><a href="a-propos.html" data-content="site.navigation.2.label"></a><a href="contact.html" data-content="site.navigation.3.label"></a></div><div class="footer-contact"><p class="footer-label" data-content="accessibilite.contact"></p><a data-attr-href="site.email_href" data-content="site.email"></a><a data-attr-href="site.telephone_href" data-content="site.telephone"></a><span data-content="site.zone"></span></div></div><div class="footer-bottom"><span data-content="site.copyright"></span><span data-content="site.footer_note"></span></div></footer>
</body></html>
